<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dustline — Tactical FPS</title>
<style>
  :root {
    --sand: #c8a06a; --rust: #8a4a2a; --teal: #2a8a7a; --steel: #2b2f33;
    --ink: #efe6d4; --dim: #b9a98c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1712;
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; }
  #app { position: fixed; inset: 0; }
  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  #hud.on { display: block; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: var(--teal); box-shadow: 0 0 3px #000; }
  #crosshair i:nth-child(1) { left: -1px; top: calc(-1 * var(--gap, 8px) - 8px); width: 2px; height: 8px; }
  #crosshair i:nth-child(2) { left: -1px; top: var(--gap, 8px); width: 2px; height: 8px; }
  #crosshair i:nth-child(3) { top: -1px; left: calc(-1 * var(--gap, 8px) - 8px); width: 8px; height: 2px; }
  #crosshair i:nth-child(4) { top: -1px; left: var(--gap, 8px); width: 8px; height: 2px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
    margin: -13px 0 0 -13px; opacity: 0; }
  #hitmarker::before, #hitmarker::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(45deg, transparent 46%, #fff 46% 54%, transparent 54%),
      linear-gradient(-45deg, transparent 46%, #fff 46% 54%, transparent 54%); }
  #hitmarker.kill::before, #hitmarker.kill::after { filter: hue-rotate(300deg) saturate(4); }
  .panel { background: rgba(20, 18, 14, 0.72); border: 1px solid rgba(200, 160, 106, 0.35);
    border-radius: 4px; padding: 8px 12px; }
  #health { position: absolute; left: 20px; bottom: 20px; min-width: 170px; }
  #health .label, #armor .label { font-size: 11px; letter-spacing: 2px; color: var(--dim); }
  #health-num { font-size: 30px; font-weight: 700; color: var(--sand); }
  #armor-num { font-size: 20px; font-weight: 700; color: var(--teal); }
  #armor { position: absolute; left: 210px; bottom: 20px; }
  #ammo { position: absolute; right: 20px; bottom: 20px; text-align: right; }
  #ammo-mag { font-size: 34px; font-weight: 700; color: var(--ink); }
  #ammo-reserve { font-size: 18px; color: var(--dim); }
  #money { position: absolute; right: 20px; bottom: 96px; font-size: 20px; font-weight: 700;
    color: var(--sand); }
  #timer { position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    font-size: 26px; font-weight: 700; text-align: center; }
  #score { position: absolute; left: 50%; top: 64px; transform: translateX(-50%);
    font-size: 18px; font-weight: 700; }
  #score-us { color: var(--teal); } #score-them { color: var(--rust); }
  #round-num { position: absolute; left: 20px; top: 14px; font-size: 13px; letter-spacing: 2px;
    color: var(--dim); }
  #bomb-status { position: absolute; left: 50%; top: 104px; transform: translateX(-50%);
    font-size: 15px; font-weight: 700; color: #ff9a4a; text-shadow: 0 1px 2px #000; }
  #killfeed { position: absolute; right: 20px; top: 14px; text-align: right; font-size: 13px;
    line-height: 1.7; color: var(--ink); text-shadow: 0 1px 2px #000; }
  #killfeed .them { color: #e08a5a; } #killfeed .us { color: #6fc4b4; }
  #minimap { position: absolute; left: 20px; top: 52px; width: 150px; height: 112px;
    border: 1px solid rgba(200, 160, 106, 0.4); background: rgba(20, 18, 14, 0.8); border-radius: 4px; }
  #reload-hint { position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
    font-size: 14px; letter-spacing: 2px; color: var(--sand); opacity: 0; }
  #damage-vignette { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(160, 20, 10, 0.55) 100%); }
  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: none; align-items: center;
    justify-content: center; flex-direction: column; text-align: center;
    background: rgba(12, 10, 8, 0.78); }
  .overlay.on { display: flex; }
  .overlay h1 { font-size: 64px; letter-spacing: 10px; color: var(--sand);
    text-shadow: 0 3px 0 var(--rust); }
  .overlay h1 span { color: var(--teal); }
  .overlay p { color: var(--dim); margin: 12px 0 24px; max-width: 520px; line-height: 1.6; }
  .overlay h2 { font-size: 44px; letter-spacing: 6px; }
  button { pointer-events: auto; cursor: pointer; background: var(--teal); color: #fff;
    border: none; border-radius: 4px; padding: 14px 42px; font-size: 18px; font-weight: 700;
    letter-spacing: 2px; }
  button:hover { background: #35a593; }
  #buy-list { pointer-events: auto; text-align: left; font-size: 15px; line-height: 2;
    background: rgba(20, 18, 14, 0.85); border: 1px solid var(--rust); border-radius: 6px;
    padding: 16px 24px; margin-bottom: 20px; min-width: 340px; }
  #buy-list b { color: var(--sand); float: right; margin-left: 30px; }
  #buy-list .key { color: var(--teal); font-weight: 700; }
  kbd { background: var(--steel); border-radius: 3px; padding: 1px 6px; font-size: 12px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="damage-vignette"></div>

<div id="hud">
  <div id="crosshair"><i></i><i></i><i></i><i></i></div>
  <div id="hitmarker"></div>
  <div id="health" class="panel"><div class="label">HEALTH</div><span id="health-num">100</span></div>
  <div id="armor" class="panel"><div class="label">ARMOR</div><span id="armor-num">0</span></div>
  <div id="ammo" class="panel"><span id="ammo-mag">12</span><span> / </span><span id="ammo-reserve">36</span></div>
  <div id="money" class="panel">$800</div>
  <div id="timer" class="panel">1:40</div>
  <div id="score" class="panel"><span id="score-us">0</span> — <span id="score-them">0</span></div>
  <div id="round-num">ROUND 1 / 15</div>
  <div id="bomb-status"></div>
  <div id="killfeed"></div>
  <canvas id="minimap" width="150" height="112"></canvas>
  <div id="reload-hint">RELOADING…</div>
</div>

<div id="menu-overlay" class="overlay on">
  <h1>DUST<span>LINE</span></h1>
  <p>4v4 tactical FPS. Plant or defuse the bomb, win 8 rounds. WASD move, mouse aim,
  click fire, <kbd>R</kbd> reload, <kbd>B</kbd> buy, <kbd>Shift</kbd> walk, <kbd>Ctrl</kbd> crouch.</p>
  <button id="play-btn">DEPLOY</button>
</div>

<div id="buy-overlay" class="overlay">
  <h2>BUY MENU</h2>
  <p>Press a number key to buy. <kbd>B</kbd> / <kbd>Esc</kbd> to close.</p>
  <div id="buy-list"></div>
</div>

<div id="round-overlay" class="overlay">
  <h2 id="round-title">ROUND WON</h2>
  <p id="round-sub"></p>
</div>

<div id="match-overlay" class="overlay">
  <h2 id="match-title">VICTORY</h2>
  <p id="match-sub"></p>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
